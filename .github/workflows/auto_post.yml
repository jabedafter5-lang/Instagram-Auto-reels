name: Auto Post Instagram Reels

on:
  schedule:
    - cron: '30 6,13 * * *'
    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Yeh zaroori hai taaki script GitHub ke andar file save kar sake
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run automation script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python main.py

      - name: Auto Keep-Alive Commit
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git pull origin main --rebase || echo "No need to pull"
          python keep_alive.py
          git add keep_alive_log.txt
          git commit -m "Auto-update keep alive log to prevent inactivity pause" || echo "No changes to commit"
          git push origin main
