name: Auto Post Instagram Reels

on:
  workflow_dispatch:
  repository_dispatch:
    types: [auto_post]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run automation script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
        run: python main.py

      - name: Auto Keep-Alive Commit
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git pull origin main --rebase || echo "No need to pull"
          python keep_alive.py
          git add keep_alive_log.txt
          git commit -m "Auto-update keep alive log to prevent inactivity pause" || echo "No changes to commit"
          git push origin main
